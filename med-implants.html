<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زراعة الأسنان وتجديد العظام</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a1a2a;font-family:'Tajawal';padding:20px;color:#e0e0e0;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#5bc0be;font-size:1.9rem;margin-bottom:8px;}
        .sub{text-align:center;color:#8ab;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:#152837;border-radius:24px;padding:18px;border-right:4px solid #5bc0be;}
        .num{color:#5bc0be;font-weight:800;margin-left:8px;}
        .fact{line-height:1.5;}
        footer{text-align:center;margin-top:35px;color:#6a8e9e;font-size:0.75rem;}
    </style>
</head>
<body>
<div class="container">
    <h1>🦷 زراعة الأسنان وتجديد العظام</h1>
    <div class="sub">40 حقيقة عن أحدث تقنيات الزراعة والاندماج العظمي</div>
    <div class="grid" id="factsGrid"></div>
    <footer>معلومات موثقة من الجمعية العالمية لزراعة الأسنان | العيادة السنية الحديثة</footer>
</div>
<script>
    const facts = [
        "الزرعات السنية مصنوعة من التيتانيوم النقي الذي يمتلك خاصية الاندماج العظمي الفريدة مع جسم الإنسان.",
        "نسبة نجاح زراعة الأسنان الحديثة تتجاوز 98% بفضل تقنيات التشخيص ثلاثي الأبعاد.",
        "تقنية All-on-4 تسمح بتعويض فك كامل للمريض باستخدام 4 زرعات فقط في يوم واحد.",
        "يمكن الزراعة الفورية (الخلع والزراعة في نفس الجلسة) للحفاظ على البنية الطبيعية للثة.",
        "البلازما الغنية بالصفائح الدموية PRP/PRF تسرع التئام الجروح حول الزرعات بنسبة 50%.",
        "تقنية رفع الجيب الفكي تسمح بزيادة الكثافة العظمية في الفك العلوي لتأمين مساحة للزرعات.",
        "الزرعات لا تتعرض للتسوس أبداً لأنها مواد معدنية، لكنها تتطلب عناية فائقة باللثة.",
        "الزراعة الموجهة حاسوبياً تتم بدون شقوق جراحية واسعة، مما يلغي الألم والتورم.",
        "التطعيم العظمي (Bone Grafting) يستخدم عظاماً صناعية أو طبيعية لبناء الفك الضامر.",
        "الزرعات السنية تمنع ذوبان عظم الفك الذي يحدث طبيعياً بعد خلع الأسنان.",
        "سطح الزرعة الحديثة معالج حرارياً وكيميائياً لزيادة مساحة التماس مع الخلايا العظمية.",
        "تصميم عنق الزرعة المجهري يمنع تراكم البكتيريا ويحافظ على مستوى اللثة التجميلي.",
        "يمكن تركيب تاج مؤقت على الزرعة في نفس يوم الجراحة للحفاظ على المظهر الجمالي.",
        "الزرعات القصيرة (Short Implants) تستخدم لتجنب الجراحات المعقدة في حالات نقص العظم.",
        "هناك زرعات خالية من المعادن مصنوعة من الزيركونيا للمرضى الذين يعانون حساسية التيتانيوم.",
        "التحميل المبكر للزرعات أصبح ممكناً بفضل تطور أسطح التيتانيوم المحبة للماء.",
        "الطابعة ثلاثية الأبعاد تُستخدم لطباعة أدلة جراحية تحدد زاوية وعمق الزرعة بدقة.",
        "التدخين يقلل من تدفق الدم للثة، مما يخفض نسبة نجاح الاندماج العظمي للزرعات.",
        "قوة المضغ على الزرعات السنية تعادل 100% من قوة المضغ على الأسنان الطبيعية.",
        "الزرعات مصممة لتدوم مدى الحياة إذا التزم المريض بالصحة الفموية والمراجعات الدورية.",
        "الزرعات السنية تحفز الخلايا العظمية حولها، فتمنع الهزال العظمي المرتبط بالشيخوخة.",
        "يمكن إجراء الزراعة لكبار السن طالما لا توجد موانع صحية خطيرة.",
        "مرضى السكري المسيطر عليهم يمكنهم إجراء الزراعة بنجاح قريب من الطبيعي.",
        "زراعة الفك العلوي تتطلب أحياناً تقييماً دقيقاً للجيوب الأنفية المجاورة.",
        "تستخدم أشعة CBCT لتخطيط الزراعة قبل الجراحة لتفادي الأعصاب والأوعية الدموية.",
        "الزرعات السنية لا تسبب تسوساً ثانوياً حول عنق الزرعة كما يحدث في الجسور التقليدية.",
        "يمكن استخدام الزرعات لدعم أطقم الأسنان المتحركة (Overdentures) لتثبيتها.",
        "المضاعفات النادرة تشمل فشل الاندماج العظمي بنسبة أقل من 5%.",
        "الزرعات السنية تتطلب فحوصات دورية بالأشعة للتأكد من سلامة العظم حولها.",
        "قبل الزراعة يجب معالجة أي التهاب لثوي نشط لضمان نجاح الاندماج.",
        "تقنية (الزراعة فائقة القصر) Ultradhort Implants تستخدم للفكوك شديدة الضمور.",
        "طباعة العظم الحيوي باستخدام الخلايا الجذعية قيد التطوير لتحل محل الطعم العظمي.",
        "زراعة الأسنان لا تؤثر على إجراء الرنين المغناطيسي لأن التيتانيوم غير مغناطيسي.",
        "التاج فوق الزرعة يمكن استبداله إذا تآكل دون الحاجة للمس الزرعة الأساسية.",
        "يمكن إجراء الزراعة بعد شفاء الخلع بحوالي 3-6 أشهر أو فورية حسب الحالة.",
        "الزرعات الخزفية بالكامل تعطي جمالية ممتازة للمرضى الذين يطلبون خلوًا تامًا من المعدن.",
        "الزرعات المصغرة Mini Implants تستخدم لتثبيت الأطقم المتحركة بسرعة.",
        "تقنية (Basal Implants) تثبت في العظم القاعدي لتجنب رفع الجيب الفكي.",
        "الزرعات السنية تحسن جودة المضغ بشكل كبير مقارنة بالأطقم التقليدية.",
        "البحوث الحالية تتجه نحو زرعات ذات أسطح مضادة للبكتيريا لزيادة العمر الافتراضي."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((fact, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div><span class="num">${idx+1}.</span> <span class="fact">${fact}</span></div>`;
        container.appendChild(card);
    });
</script>
</body>
</html>
