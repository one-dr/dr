<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>تجربة التشريح التفاعلي للفكين والأسنان</title>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: radial-gradient(circle at center, #2c3e50 0%, #0a1118 100%); font-family: 'Segoe UI', Tahoma, sans-serif; color: white; user-select: none; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; z-index: 100; text-align: center; }
        #loading .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #error-msg { margin-top: 15px; color: #e74c3c; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; display: none; }

        #ui-container { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; flex-wrap: wrap; justify-content: center; width: 95%; max-width: 600px; }
        .main-btn { padding: 12px 18px; font-size: 14px; font-weight: bold; cursor: pointer; background: rgba(43, 87, 151, 0.85); color: white; border: 1px solid #4a90e2; border-radius: 8px; backdrop-filter: blur(5px); transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .main-btn:active { background: #1e3f70; transform: translateY(2px); }
        .main-btn.active { background: #e67e22; border-color: #f39c12; }

        #restore-container { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 15; max-height: 75vh; overflow-y: auto; padding-left: 10px; pointer-events: none; }
        .restore-btn { pointer-events: auto; padding: 8px 12px; font-size: 13px; font-weight: bold; background: rgba(231, 76, 60, 0.9); color: white; border: 1px solid #c0392b; border-radius: 6px; cursor: pointer; text-align: right; -webkit-tap-highlight-color: transparent; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        #fullscreen-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 17, 24, 0.95); z-index: 999; 
            flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        #fullscreen-img {
            max-width: 95%; max-height: 85vh; object-fit: contain; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        #back-btn {
            margin-top: 20px; padding: 12px 30px; font-size: 18px; font-weight: bold; cursor: pointer;
            background: #e74c3c; color: white; border: none; border-radius: 30px; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: all 0.2s; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; gap: 8px;
        }
        #back-btn:active { background: #c0392b; transform: scale(0.95); }

        .hint { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #ecf0f1; pointer-events: none; z-index: 5; backdrop-filter: blur(3px); }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">جاري معالجة المجسم الطبي...</div>
        <div id="error-msg"></div>
    </div>
    
    <div class="hint">حرك لتدوير • انقر لحذف العظام • انقر على السن للصورة</div>

    <div id="restore-container"></div>

    <div id="ui-container">
        <button class="main-btn" onclick="toggleXRay(this)">وضع الأشعة (X-Ray)</button>
        <button class="main-btn" onclick="resetModel()">إعادة تجميع الهيكل</button>
    </div>

    <div id="fullscreen-overlay">
        <img id="fullscreen-img" src="" alt="صورة السن التفصيلية">
        <button id="back-btn" onclick="closeFullscreen()">&#10006; رجوع للمجسم</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <script>
        const script = document.createElement('script');
        script.src = 'script.js?v=' + new Date().getTime();
        document.body.appendChild(script);
    </script>
</body>
</html>
