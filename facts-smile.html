<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الابتسامة والجمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#fff0f5;font-family:'Tajawal';padding:20px;}
        .container{max-width:1000px;margin:auto;}
        h1{text-align:center;color:#b83b5e;font-size:2rem;}
        .sub{text-align:center;color:#c85a7a;margin-bottom:25px;}
        .list{background:white;border-radius:40px;padding:20px;}
        .item{display:flex;margin-bottom:14px;align-items:flex-start;gap:12px;border-bottom:1px solid #ffe0e7;padding:8px 0;}
        .num{background:#f4a0b8;color:white;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:30px;flex-shrink:0;}
        .text{flex:1;}
        footer{text-align:center;margin-top:30px;color:#b83b5e;}
    </style>
</head>
<body>
<div class="container">
    <h1>😁 الابتسامة والجمال</h1>
    <div class="sub">37 حقيقة عن قوة الابتسامة وتأثيرها</div>
    <div class="list" id="factsList"></div>
    <footer>ابتسامتك سر جاذبيتك | العيادة السنية الحديثة</footer>
</div>
<script>
    const facts = [
        "الابتسامة هي أول شيء يلاحظه 50% من الناس عند مقابلة شخص جديد.",
        "الابتسام يفرز هرمونات الإندورفين التي تشعرك بالسعادة وتقلل الألم.",
        "الابتسام يتطلب عضلات أقل من العبوس.",
        "الأسنان المرتبة تعطي انطباعاً بالثقة والنجاح في بيئة العمل.",
        "تبييض الأسنان بالليزر هو أسرع إجراء تجميلي لرفع جاذبية الوجه.",
        "القشرة الخزفية (Veneers) لا يتغير لونها مع الزمن بعكس الأسنان الطبيعية.",
        "شكل الابتسامة المثالية يتبع خط انحناء الشفة السفلية.",
        "الابتسامة 'المعدية' حقيقة علمية بسبب الخلايا العصبية المرآتية.",
        "الأسنان المفقودة تسبب ترهل عضلات الوجه وظهور الشيخوخة المبكرة.",
        "تصميم الابتسامة الرقمي (DSD) يسمح برؤية النتيجة قبل بدء العلاج.",
        "عدسات الإيماكس هي قشور خزفية فائقة الشفافية.",
        "سماكة الفينير التجميلي لا تتجاوز 0.3 ملم (أرق من العدسة اللاصقة).",
        "اللومينير هو نوع من القشور التي توضع بدون برد المينا.",
        "تبييض الأسنان بالليزر يفكك جزيئات التصبغات بالأكسجين النشط.",
        "لون الابتسامة المثالية يختار بناءً على بياض عين المريض ولون بشرته.",
        "الابتسامة اللثوية تُعالج بقص اللثة بالليزر وتطويل التيجان.",
        "الفينير مقاوم تماماً للتصبغات، لا يتأثر بالقهوة أو التدخين.",
        "الترابط الكيميائي بين الفينير والمينا من أقوى الروابط الطبية.",
        "الحشوات التجميلية الكومبوزيت تُنحت مباشرة في العيادة.",
        "تناسق الخط الأوسط للأسنان مع منتصف الوجه هو القاعدة الذهبية.",
        "يمكن إجراء تبييض داخلي للأسنان الميتة التي تغير لونها.",
        "قاعدة النسبة الذهبية تُستخدم لتحديد عرض كل سن.",
        "حواف الأسنان الأمامية للشباب تكون مسننة ومستديرة.",
        "المايكرو-أبريجن يزيل البقع البيضاء من سطح السن بدون حفر.",
        "تصميم الابتسامة يأخذ حركة الشفاه أثناء الضحك.",
        "بوتوكس الشفاه يُستخدم لإخفاء الابتسامة اللثوية.",
        "الإسمنت اللاصق الحديث للفينير يأتي بدرجات شفافية متعددة.",
        "الابتسامة العريضة تملأ الفراغات السوداء في زوايا الفم.",
        "تقنية الموك أب تسمح بتجربة الابتسامة الجديدة من البلاستيك المؤقت.",
        "التجميل لا يقتصر على العلوية، فالسفلية تظهر أثناء الكلام.",
        "ابتسامة هوليوود ليست مجرد بياض بل تناسق في الحجم والزوايا.",
        "الابتسامة تزيد من جاذبية الشخص بنسبة 70% وفقاً لدراسات.",
        "الأسنان المصفوفة تسهل النظافة وتقي من التسوس.",
        "تبييض الأسنان المنزلي أقل فعالية من العيادة.",
        "الابتسامة تزيد من ثقة الأطفال بأنفسهم.",
        "الابتسامة تقلل هرمون التوتر (الكورتيزول).",
        "الناس يفضلون التعامل مع من يبتسمون."
    ];
    const container = document.getElementById('factsList');
    facts.forEach((f,i)=>{
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<div class="num">${i+1}</div><div class="text">${f}</div>`;
        container.appendChild(div);
    });
</script>
</body>
</html>
