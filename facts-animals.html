<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسنان في عالم الحيوان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#fef9e4;font-family:'Tajawal';padding:20px;}
        .container{max-width:1000px;margin:auto;}
        h1{text-align:center;color:#5e3a1f;font-size:2rem;}
        .sub{text-align:center;margin-bottom:25px;color:#8b5a2b;}
        .list{background:#fff6e8;border-radius:40px;padding:20px;box-shadow:0 8px 20px rgba(0,0,0,0.05);}
        .fact-row{display:flex;align-items:baseline;padding:10px 0;border-bottom:1px dashed #e2c8a8;}
        .num{width:45px;font-weight:800;color:#b97f44;}
        .fact{flex:1;}
        footer{text-align:center;margin-top:30px;color:#a8763a;}
    </style>
</head>
<body>
<div class="container">
    <h1>🦁 الأسنان في عالم الحيوان</h1>
    <div class="sub">37 مقارنة مذهلة بين أسنان البشر والحيوانات</div>
    <div class="list" id="factsList"></div>
    <footer>الحلزون لديه 14,000 سن! | العيادة السنية الحديثة</footer>
</div>
<script>
    const facts = [
        "الحلزون يمتلك أكثر من 14,000 سن صغيرة جداً.",
        "سمك القرش يفقد أسنانه باستمرار وينبت غيرها (يستهلك 35 ألف سن في حياته).",
        "أسنان 'سمك القوبع' هي أصلب مادة بيولوجية معروفة في الطبيعة.",
        "أنياب الفيل هي في الحقيقة أسنان قاطعة مستمرة في النمو.",
        "التمساح يستبدل أسنانه حوالي 50 مرة طوال حياته.",
        "القوارض (مثل الفئران) تمتلك أسناناً أمامية لا تتوقف عن النمو أبداً.",
        "الحيتان الزرقاء ليس لديها أسنان، بل لديها 'بالين' لتصفية الطعام.",
        "البعوض يمتلك 47 سناً صغيراً يستخدمها لثقب الجلد.",
        "أسنان فرس النهر يمكن أن يصل طولها إلى 50 سنتيمتراً.",
        "الزرافة لديها أسنان سفلية فقط ولا تملك أسنان علوية أمامية.",
        "أسنان الفيل يمكن أن تزن كل منها 4 كجم.",
        "الكلب يمتلك 42 سناً، بينما القطط 30 سناً.",
        "أسنان القنفذ تسقط وتستبدل مرة واحدة فقط في حياته.",
        "الضفدع ليس له أسنان في فكه السفلي فقط علوي.",
        "سلحفاة البحر لها أسنان حادة تشبه المنقار لكنها ليست حقيقية.",
        "أسنان الأرنب تنمو باستمرار بمعدل 3 مم أسبوعياً.",
        "الخنزير البري يمتلك أنياباً تنمو مدى الحياة.",
        "الدولفين له حوالي 100 سن مخروطية لاصطياد الأسماك.",
        "فرس البحر ليس له أسنان على الإطلاق.",
        "أسنان النسر مصممة لتمزيق اللحم.",
        "الليمور له أسنان مشطية خاصة لتنظيف الفراء.",
        "الأسد له 30 سناً، والأنياب يمكن أن تصل 8 سم.",
        "أسنان الخفاش حادة جداً لتمزيق الفاكهة أو الحشرات.",
        "الحرباء لها أسنان ملتصقة بالعظم لا جذور.",
        "أسنان الأخطبوط موجودة في فمه الداخلي.",
        "الفظ له أنياب طويلة تصل إلى متر واحد.",
        "أسنان الكسلان بسيطة جداً لأنها تأكل الأوراق.",
        "التمساح لديه قوة عض تصل إلى 3700 رطل لكل بوصة مربعة.",
        "أسنان الزرافة تطحن الأوراق والأشواك.",
        "الكنغر له أسنان متخصصة لقص العشب.",
        "أسنان البطريق خلفية حادة لاصطياد السمك.",
        "الذئب له 42 سناً، والأنياب طويلة جداً.",
        "أسنان الحصان تطحن الأعشاب لمدة 20 ساعة يومياً.",
        "الوحيد القرن ليس له أسنان أمامية، فقط أضراس جانبية.",
        "أسنان الهامستر تنمو طوال حياته.",
        "القرش الأبيض يفقد حوالي 1000 سن سنوياً.",
        "أسنان الأخطبوط ليست مثل البشر بل تشبه مبشرة."
    ];
    const container = document.getElementById('factsList');
    facts.forEach((f,i)=>{
        const row = document.createElement('div');
        row.className = 'fact-row';
        row.innerHTML = `<div class="num">${i+1}.</div><div class="fact">🐾 ${f}</div>`;
        container.appendChild(row);
    });
</script>
</body>
</html>
