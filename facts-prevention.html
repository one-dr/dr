<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوقاية والصحة العامة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#e6f4ea;font-family:'Tajawal';padding:20px;}
        .container{max-width:1100px;margin:auto;}
        .header{background:#2e6b3e;color:white;padding:20px;border-radius:40px 40px 0 0;text-align:center;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px;}
        .card{background:white;border-radius:28px;padding:16px;box-shadow:0 6px 12px rgba(0,0,0,0.05);border-top:5px solid #4caf50;}
        .card .number{background:#4caf50;color:white;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:40px;margin-bottom:8px;font-weight:bold;}
        footer{text-align:center;margin-top:30px;color:#2e6b3e;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛡️ الوقاية والصحة العامة</h1>
        <p>37 نصيحة وحقيقة لحماية أسنانك</p>
    </div>
    <div class="grid" id="factsGrid"></div>
    <footer>الوقاية خير من العلاج | العيادة السنية الحديثة</footer>
</div>
<script>
    const facts = [
        "تنظيف الأسنان بالخيط يصل إلى 35% من أسطح الأسنان التي لا تصلها الفرشاة.",
        "أمراض اللثة تزيد من خطر الإصابة بأمراض القلب.",
        "التهابات الأسنان قد تكون مرتبطة بمرض السكري.",
        "النساء الحوامل أكثر عرضة لالتهاب اللثة بسبب التغيرات الهرمونية.",
        "إذا فقدت سناً في حادث، يمكنك وضعه في الحليب والذهاب فوراً للطبيب لإعادة زرعه.",
        "تنظيف الأسنان مباشرة بعد شرب الصودا يضر المينا (انتظر 30 دقيقة).",
        "اليد التي تستخدمها في الكتابة عادة ما تكون هي الجانب الذي تمضغ عليه الطعام أكثر.",
        "شرب الشاي الأخضر يساعد في قتل بكتيريا الفم.",
        "الجبن يساعد في حماية الأسنان عن طريق تحييد الأحماض.",
        "فرشاة الأسنان يجب تغييرها كل 3 أشهر أو بعد الإصابة بالإنفلونزا.",
        "تنظيف الأسنان مرتين يومياً يقلل خطر فقدان الأسنان بنسبة 60%.",
        "استبدال المشروبات الغازية بالماء يمنع تسوس 3-5 أسنان سنوياً.",
        "زراعة الأسنان ناجحة بنسبة تصل إلى 98%.",
        "التدخين هو السبب الرئيسي الأول لفقدان الأسنان لدى البالغين.",
        "60% من الناس لا يعرفون أن أمراض اللثة قد لا تسبب ألماً في بدايتها.",
        "الفلورايد الموضعي يقلل التسوس بنسبة 40% عند الأطفال.",
        "المواد السادة للشقوق (سيلانتس) تمنع التسوس في الأضراس الدائمة.",
        "تنظيف اللسان يقلل رائحة الفم بنسبة 70%.",
        "استخدام غسول فم مضاد للبكتيريا يقلل البلاك.",
        "شرب الماء المفلور يقلل التسوس بنسبة 25%.",
        "مضغ العلكة الخالية من السكر يحفز اللعاب ويحمي الأسنان.",
        "الرضاعة الطبيعية تقلل من تسوس الأسنان مقارنة بالزجاجة.",
        "تقليل السكريات بين الوجبات أهم من كمية السكر نفسها.",
        "تناول التفاح والجزر ينظف الأسنان طبيعياً.",
        "الحد من المشروبات الحمضية يقي من تآكل المينا.",
        "استخدام واقي الأسنان أثناء الرياضات العنيفة يمنع الكسور.",
        "معالجة تسوس الأسنان المبكر يوفر الكثير من المال والألم.",
        "زيارة طبيب الأسنان كل 6 أشهر للفحص والتنظيف ضرورية.",
        "تعليم الأطفال تنظيف الأسنان من عمر سنة يرسخ العادة.",
        "الفلورايد في معجون الأسنان يقلل التسوس بنسبة 25%.",
        "تنظيف الأسنان بالفرشاة لمدة دقيقتين كافٍ لإزالة البلاك.",
        "لا تشارك فرشاة الأسنان مع الآخرين.",
        "تخزين الفرشاة في مكان مكشوف يمنع نمو البكتيريا.",
        "استخدام خيط الأسنان يمنع التهاب اللثة بين الأسنان.",
        "الحد من الوجبات الخفيفة السكرية يقلل هجمات الحمض.",
        "شرب الماء بعد كل وجبة يغسل بقايا الطعام.",
        "الإقلاع عن التدخين يحسن صحة اللثة بشكل كبير."
    ];
    const grid = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="number">${i+1}</div><p>${f}</p>`;
        grid.appendChild(card);
    });
</script>
</body>
</html>
