<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللعاب والبكتيريا - المختبر الحيوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#e0f2fe;font-family:'Tajawal',sans-serif;padding:20px 16px;}
        .container{max-width:1100px;margin:0 auto;}
        .hero{background:#0284c7;color:white;padding:20px;border-radius:40px;text-align:center;margin-bottom:25px;}
        .hero h1{font-size:1.8rem;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
        .card{background:white;border-radius:24px;padding:18px;box-shadow:0 4px 8px rgba(0,0,0,0.05);border-bottom:4px solid #0ea5e9;}
        .card .num{background:#0ea5e9;color:white;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:30px;margin-bottom:10px;font-weight:bold;}
        .card p{font-size:0.9rem;line-height:1.4;}
        footer{text-align:center;margin-top:30px;color:#0369a1;}
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>🧪 اللعاب والبكتيريا (المختبر الحيوي)</h1>
        <p>37 حقيقة عن عالم الفم الدقيق</p>
    </div>
    <div class="grid" id="factsGrid"></div>
    <footer>البكتيريا صديق وعدو – اعرف فمك أكثر</footer>
</div>
<script>
    const facts = [
        "فمك يحتوي على بكتيريا أكثر من عدد سكان الأرض.",
        "الإنسان ينتج حوالي 25 ألف لتر من اللعاب طوال حياته (ما يملأ مسبحين).",
        "اللعاب هو خط الدفاع الأول ضد تسوس الأسنان.",
        "جفاف الفم يزيد من فرصة تسوس الأسنان بشكل هائل.",
        "اللعاب يحتوي على إنزيمات تبدأ عملية الهضم قبل وصول الطعام للمعدة.",
        "البلاك (اللويحة السنية) يتكون من أكثر من 300 نوع من البكتيريا.",
        "تنظيف اللسان يقلل من بكتيريا الفم بنسبة 70%.",
        "رائحة الفم الكريهة مصدرها الأساسي البكتيريا الموجودة على اللسان.",
        "السكر ليس ما يذيب السن، بل الحمض الذي تفرزه البكتيريا عند أكل السكر.",
        "اللعاب يساعد في تذوق الطعام (لا يمكنك التذوق إذا كان لسانك جافاً).",
        "يوجد في فم الإنسان أكثر من 700 نوع مختلف من البكتيريا.",
        "اللعاب يحتوي على مسكن ألم طبيعي (أوبيورفين).",
        "الإنسان يقضي حوالي 38.5 يوماً من حياته في تفريش أسنانه فقط.",
        "اللثة الصحية لا تنزف أبداً، النزيف علامة على مرض بكتيري.",
        "البلاك عبارة عن مستعمرة حيوية شديدة التنظيم.",
        "الجير (القلح) هو بلاك متكلس لا يمكن إزالته بالفرشاة.",
        "البكتيريا المسببة لالتهاب اللثة تنتقل للقلب وتسبب التهاب الشغاف.",
        "رائحة الفم الكريهة المزمنة سببها 85% تراكم البكتيريا اللاهوائية.",
        "مرض السكري غير المنضبط يضاعف خطر تدمير اللثة.",
        "الجيوب اللثوية التي يزيد عمقها عن 3 ملم بيئة مثالية للبكتيريا.",
        "التوتر النفسي يضعف المناعة ويزيد تدمير الأنسجة اللثوية.",
        "ارتباط بين التهابات اللثة الشديدة والولادة المبكرة.",
        "العناية باللثة حول الزرعات أهم من الأسنان الطبيعية.",
        "الحليمات اللثوية إذا فقدت تترك فراغات سوداء.",
        "الفلورايد يقلل قدرة البكتيريا على إنتاج الحمض.",
        "غسول الفم بالكلورهيكسيدين يقتل البكتيريا لكن لا يستخدم طويلاً.",
        "البكتيريا تنتج مركبات كبريتية تسبب رائحة الفم.",
        "تنظيف الأسنان بالخيط يزيل 40% من البلاك بين الأسنان.",
        "اللعاب ليلاً يقلل إنتاجه، لذا التسوس يحدث أكثر أثناء النوم.",
        "مضغ العلكة الخالية من السكر يحفز اللعاب ويحمي الأسنان.",
        "البروبيوتيك الفموي قد يقلل من بكتيريا التسوس.",
        "البكتيريا العقدية الطافرة هي السبب الرئيسي للتسوس.",
        "الرضاعة الطبيعية تقلل من بكتيريا التسوس مقارنة بالزجاجة.",
        "اللعاب يحتوي على الليزوزيم الذي يكسر جدران البكتيريا.",
        "جفاف الفم بسبب الأدوية يزيد التسوس 3 أضعاف.",
        "التهاب اللثة يزيد من بكتيريا الفم في مجرى الدم.",
        "اللسان يحوي أخاديد تختبئ فيها البكتيريا المنتجة للرائحة."
    ];
    const grid = document.getElementById('factsGrid');
    facts.forEach((fact,i)=>{
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="num">${i+1}</div><p>${fact}</p>`;
        grid.appendChild(card);
    });
</script>
</body>
</html>
