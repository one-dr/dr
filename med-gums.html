<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معالجة اللثة والأنسجة الداعمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f8f0e7;font-family:'Tajawal';padding:20px;color:#3a2c2a;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#bc6c25;font-size:1.9rem;}
        .sub{text-align:center;color:#9c5211;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:white;border-radius:28px;padding:18px;box-shadow:0 6px 12px rgba(0,0,0,0.05);border-bottom:4px solid #bc6c25;}
        .num{background:#bc6c25;color:white;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:30px;margin-left:10px;}
        footer{text-align:center;margin-top:35px;color:#9a6e4b;}
    </style>
</head>
<body>
<div class="container">
    <h1>🩸 معالجة اللثة والأنسجة الداعمة</h1>
    <div class="sub">40 حقيقة عن أمراض اللثة والوقاية والعلاج</div>
    <div class="grid" id="factsGrid"></div>
    <footer>لثة صحية = أسنان قوية مدى الحياة</footer>
</div>
<script>
    const facts = [
        "أمراض اللثة هي السبب رقم واحد لفقدان الأسنان لدى البالغين وليس التسوس كما يعتقد البعض.",
        "البلاك عبارة عن مستعمرة حيوية شديدة التنظيم، لا يمكن إزالتها بالمضمضة بل بالاحتكاك الميكانيكي.",
        "الجير (القلح) هو بلاك متكلس وقاسٍ، لا يمكن إزالته بفرشاة الأسنان ويحتاج لأجهزة الموجات فوق الصوتية.",
        "التهاب اللثة المتقدم يذيب العظم المحيط بالسن في صمت وبدون ألم حتى يتخلخل السن ويسقط.",
        "البكتيريا المسببة لالتهاب اللثة يمكن أن تنتقل عبر الدم لتصل إلى القلب وتسبب التهاب الشغاف القلبي.",
        "النزيف اللثوي أثناء التفريش ليس طبيعياً أبداً، وهو جرس إنذار لالتهاب نشط يحتاج لعلاج فوري.",
        "تقنية التجديد النسيجي الموجه تستخدم أغشية كولاجين لمنع اللثة من غزو الفراغ والسماح للعظم بالنمو.",
        "ترقيع اللثة المجهري ينقل أنسجة سليمة من سقف الحلق لتغطية جذور الأسنان المتراجعة والمكشوفة.",
        "رائحة الفم الكريهة المزمنة يكون سببها بنسبة 85% تراكم البكتيريا اللاهوائية في الجيوب اللثوية.",
        "التدخين يخفي علامات التهاب اللثة عن طريق تضييق الأوعية الدموية، مما يخدع المريض بعدم وجود نزيف.",
        "مرض السكري غير المنضبط يضاعف خطر تدمير اللثة والعظم، واللثة الملتهبة بدورها ترفع مستويات السكر.",
        "الجيوب اللثوية التي يزيد عمقها عن 3 ملم تعتبر بيئة مثالية لنمو البكتيريا المدمرة ويصعب على الفرشاة الوصول إليها.",
        "تقنية التجريف اللثوي العميق تنعم سطح الجذور لمنع البكتيريا من الالتصاق بها مرة أخرى.",
        "التوتر النفسي الشديد يضعف جهاز المناعة ويزيد من حدة وسرعة تدمير الأنسجة اللثوية.",
        "هناك ارتباط علمي مثبت بين التهابات اللثة الشديدة والولادة المبكرة وانخفاض وزن الجنين.",
        "الألياف اللثوية القوية تعمل كمساعدات امتصاص صدمات للأسنان أثناء مضغ الأشياء القاسية.",
        "انحسار اللثة الدائم لا يعود من تلقاء نفسه، ويحتاج لتدخل جراحي دقيق لإعادة بنائه.",
        "استخدام فرشاة أسنان قاسية يساهم في تدمير اللثة وبرد طبقة المينا، والفرشاة الناعمة هي الخيار الطبي الأصح.",
        "العناية باللثة حول الزرعات أهم بكثير من العناية بالأسنان الطبيعية، لأن الزرعات لا تملك أليافاً عصبية تحذر من الخطر.",
        "الحليمات اللثوية (المثلثات الوردية بين الأسنان) إذا فقدت بسبب الالتهاب، يترك ذلك فراغات سوداء مزعجة جمالياً.",
        "تنظيف الأسنان الاحترافي كل 6 أشهر يمنع تطور التهاب اللثة إلى دواعم السن.",
        "اللثة الصحية تكون وردية فاتحة، متماسكة، لا تنزف.",
        "يمكن استخدام الليزر لعلاج الجيوب اللثوية بدلاً من الجراحة المفتوحة.",
        "العلاج بالمضادات الحيوية الموضعية داخل جيب اللثة فعال جداً.",
        "أمراض اللثة مرتبطة بمرض الزهايمر وفق أحدث الدراسات.",
        "التهاب اللثة أثناء الحمل (gingivitis gravidarum) شائع بسبب التغيرات الهرمونية.",
        "يجب على مرضى القلب استشارة الطبيب قبل إجراء جراحة لثة.",
        "التراجع اللثوي قد يحدث بسبب فرط التنظيف أو بسبب عضوية (Bruxism).",
        "ترقيع اللثة يمكن أن يؤخذ من سقف الحلق أو من بنك الأنسجة.",
        "المواد العظمية الاصطناعية تستخدم في تجديد العظم المفقود حول الأسنان.",
        "مرضى الضغط المرتفع المسيطر عليهم يمكنهم علاج اللثة بأمان.",
        "التدخين الإلكتروني يضر اللثة مثل التدخين التقليدي.",
        "نقص فيتامين C يسبب نزيف اللثة وضعف التئامها.",
        "مرضى الإيدز معرضون لالتهاب لثة شديد.",
        "العلاج الداعم للثة يتضمن متابعة كل 3 أشهر.",
        "جراحة رفع السديلة اللثوية لتنظيف الجذور العميقة.",
        "يمكن استخدام عامل النمو المشتق من الصفائح الدموية لتجديد اللثة.",
        "أجهزة الري الفموي (Waterpik) مفيدة لمرضى اللثة.",
        "اللثة الملتهبة قد تسبب رائحة فم كريهة يصعب إخفاؤها.",
        "العناية اليومية بالخيط والفرشاة تقلل خطر التهاب اللثة بنسبة 70%."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<span class="num">${i+1}</span> ${f}`; container.appendChild(d); });
</script>
</body>
</html>
