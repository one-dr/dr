<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجميل الأسنان وابتسامة هوليوود</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#fff5f0;font-family:'Tajawal';padding:20px;color:#3a2c2a;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#c05c3e;font-size:1.9rem;}
        .sub{text-align:center;color:#a64b2e;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:white;border-radius:28px;padding:18px;box-shadow:0 6px 12px rgba(0,0,0,0.05);border-top:5px solid #f4a261;}
        .num{background:#f4a261;color:white;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:30px;margin-left:10px;}
        footer{text-align:center;margin-top:35px;color:#b6724a;}
    </style>
</head>
<body>
<div class="container">
    <h1>✨ تجميل الأسنان وابتسامة هوليوود</h1>
    <div class="sub">40 حقيقة عن جماليات الابتسامة وتقنيات التجميل</div>
    <div class="grid" id="factsGrid"></div>
    <footer>ابتسامتك هي بطاقة تعريفك – استثمر فيها</footer>
</div>
<script>
    const facts = [
        "عدسات الإيماكس (E-max) هي قشور خزفية فائقة الشفافية تحاكي انعكاس الضوء على السن الطبيعي.",
        "سماكة الفينير التجميلي الحديث لا تتجاوز 0.3 ملم (أرق من العدسة اللاصقة).",
        "اللومينير هو نوع من القشور التي يتم لصقها بدون برد أو إزالة أي جزء من مينا السن.",
        "تبييض الأسنان بالليزر لا يزيل طبقة المينا، بل يفكك جزيئات التصبغات العميقة بواسطة الأكسجين النشط.",
        "لون الابتسامة المثالية لا يكون أبيض ورقياً، بل يتم اختياره بناءً على بياض عين المريض ولون بشرته.",
        "الابتسامة اللثوية تُعالج تجميلياً بقص اللثة بالليزر وتطويل التيجان للحصول على تناسق مثالي.",
        "الفينير المصنوع من الخزف مقاوم تماماً للتصبغات، لا يتأثر بالقهوة أو التدخين بمرور الزمن.",
        "الترابط الكيميائي بين الفينير ومينا السن يعتبر من أقوى الروابط الطبية المعترف بها.",
        "الحشوات التجميلية الكومبوزيت تُنحت مباشرة في العيادة لتغيير شكل السن في جلسة واحدة.",
        "تناسق الخط الأوسط للأسنان العلوية مع منتصف الوجه هو القاعدة الذهبية الأولى في تصميم هوليوود سمايل.",
        "يمكن إجراء تبييض داخلي للأسنان الميتة التي تغير لونها للأسود بعد سحب العصب لإعادتها للونها الطبيعي.",
        "قاعدة النسبة الذهبية تُستخدم رياضياً لتحديد عرض كل سن بالنسبة للسن الذي يجاوره.",
        "حواف الأسنان الأمامية للشباب تكون مسننة ومستديرة، بينما تصبح مستقيمة وحادة مع التقدم في العمر.",
        "المايكرو-أبريجن تقنية تزيل البقع البيضاء الكلسية من سطح السن بدون حفر.",
        "تصميم الابتسامة يأخذ بالاعتبار حركة الشفاه العلوية أثناء الضحك لتحديد طول الأسنان الأمامية.",
        "بوتوكس الشفاه يُستخدم أحياناً في طب الأسنان التجميلي لإرخاء الشفة العلوية وإخفاء الابتسامة اللثوية.",
        "الإسمنت اللاصق الحديث للفينير يأتي بدرجات شفافية متعددة لضبط اللون النهائي للسن بدقة.",
        "الابتسامة العريضة التي تملأ الفراغات السوداء في زوايا الفم تعطي مظهراً أكثر شباباً.",
        "تقنية الموك أب تسمح للمريض بتجربة ابتسامته الجديدة من البلاستيك المؤقت قبل الموافقة عليها.",
        "التجميل لا يقتصر على الأسنان العلوية، فتناسق الأسنان السفلية ضروري لأنها تظهر أكثر عند الكلام.",
        "الفينير الخزفي يمكنه تصحيح الأسنان الملتوية والمكسورة والمتآكلة في زيارتين فقط.",
        "تبييض الأسنان المنزلي باستخدام القوالب المخصصة يعطي نتائج تدوم سنة.",
        "التبييض بالليزر يعطي نتائج فورية خلال جلسة واحدة مدتها ساعة.",
        "الحشوات البيضاء (الكومبوزيت) يمكن تشكيلها لتصحيح شكل الأسنان ببساطة.",
        "استخدام الفينير يتطلب إزالة طبقة رقيقة جداً من المينا (0.2-0.5 مم).",
        "قشور اللومينير لا تتطلب أي تحضير للسن في كثير من الحالات.",
        "تصميم الابتسامة الرقمي DSD يضمن النتيجة المتوقعة قبل البدء.",
        "الابتسامة الهوليوودية ليست حكراً على المشاهير، بل أصبحت في متناول الجميع.",
        "إعادة تشكيل اللثة بالليزر تحسن مظهر الأسنان القصيرة.",
        "الحشوات التجميلية يمكن أن تصلح تشققات الأسنان الصغيرة دون الحاجة لفينير.",
        "الفينير يخفي التصبغات العميقة التي لا يستطيع التبييض إزالتها.",
        "يمكن الجمع بين التبييض والفينير للحصول على أفضل نتيجة.",
        "الأسنان المركبة بشكل جيد تحسن من نطق الحروف.",
        "الابتسامة الجميلة تزيد الثقة في المقابلات الشخصية والمناسبات الاجتماعية.",
        "تكلفة ابتسامة هوليوود تختلف حسب عدد القشور ونوع المادة.",
        "الفينير المصنوع من الإيماكس يعطي شفافية طبيعية.",
        "الزيركون التجميلي يستخدم للتيجان الخلفية والجسور الأمامية.",
        "يمكن إجراء إعادة تأهيل شامل للفم بتصميم رقمي متكامل.",
        "ابتسامة هوليوود تدوم من 10 إلى 20 سنة مع العناية الجيدة.",
        "أحدث التقنيات تسمح بصنع الفينير في العيادة في جلسة واحدة باستخدام CAD/CAM."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<div><span class="num">${i+1}</span> ${f}</div>`; container.appendChild(d); });
</script>
</body>
</html>
