<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب الأسنان الرقمي والذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0e1a1f;font-family:'Tajawal';padding:20px;color:#cfdde5;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#00adb5;margin-bottom:8px;}
        .sub{text-align:center;color:#7e9aa8;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:#152e38;border-radius:24px;padding:18px;border-bottom:3px solid #00adb5;}
        .num{color:#00e5ff;font-weight:700;margin-left:8px;}
        footer{text-align:center;margin-top:35px;color:#5a7e8c;}
    </style>
</head>
<body>
<div class="container">
    <h1>💻 طب الأسنان الرقمي والذكاء الاصطناعي</h1>
    <div class="sub">40 حقيقة عن الثورة التكنولوجية في طب الأسنان</div>
    <div class="grid" id="factsGrid"></div>
    <footer>الذكاء الاصطناعي يغير مستقبل التشخيص والعلاج</footer>
</div>

        "تحليل الابتسامة بالذكاء الاصطناعي يقيم تناسق الأسنان واللثة والشفتين.",

        "التصوير بالفلورة الضوئية يكتشف التسوس تحت الحشوات القديمة.",
        "الليزر الرقمي يستخدم لقياس المسافات بدقة داخل الفم.",

        "الحساسات الإلكترونية في الأجهزة تحدد قوة الضغط أثناء إجراءات الزراعة.",
        "التطورات القادمة: رقاقات نانوية تراقب صحة الفم وتنبه المريض."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<span class="num">${i+1}.</span> ${f}`; container.appendChild(d); });
</script>
</body>
</html>
