<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التشخيص الشعاعي والمواد الحيوية الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#eef2f5;font-family:'Tajawal';padding:20px;color:#1e3c4a;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#2c7da0;font-size:1.9rem;}
        .sub{text-align:center;color:#4f9abf;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:white;border-radius:28px;padding:18px;box-shadow:0 6px 12px rgba(0,0,0,0.05);border-top:4px solid #2c7da0;}
        .num{background:#2c7da0;color:white;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:30px;margin-left:10px;}
        footer{text-align:center;margin-top:35px;color:#6c9ebf;}
    </style>
</head>
<body>
<div class="container">
    <h1>📡 التشخيص الشعاعي والمواد الحيوية الذكية</h1>
    <div class="sub">40 حقيقة عن أحدث وسائل التشخيص والمواد الذكية</div>
    <div class="grid" id="factsGrid"></div>
    <footer>التشخيص الدقيق هو أساس العلاج الناجح</footer>
</div>
<script>
    const facts = [
        "الأشعة المقطعية المخروطية ثلاثية الأبعاد توفر صوراً دقيقة للفك من كل الزوايا وتستخدم إشعاعاً أقل بـ 90% من الأشعة المقطعية الطبية العادية.",
        "الحشوات الذكية تستطيع استشعار انخفاض درجة الحموضة في الفم وإطلاق الكالسيوم والفوسفات لحماية السن.",
        "أجهزة الكشف بالتألق الضوئي تستطيع رؤية التسوس وتراكم البكتيريا من خلال ألوان مضيئة تتوهج تحت ضوء خاص.",
        "الخلايا الجذعية الموجودة في لب الأسنان اللبنية وأضراس العقل يمكن حفظها في بنوك خاصة لاستخدامها في علاج أمراض مستعصية مستقبلاً.",
        "المواد النشطة حيوياً لا تسد الحفرة فقط، بل تندمج مع بنية السن وتشجعه على إعادة بناء المينا المتضرر.",
        "أجهزة التصوير البانورامي الرقمي تلتقط صورة كاملة لجميع الأسنان والفكين والمفاصل والجيوب الأنفية في دورة واحدة مدتها 14 ثانية.",
        "طباعة الأنسجة الحيوية هي تقنية يتم العمل عليها لطباعة أسنان حية كاملة بخلايا وعصب وأوعية دموية.",
        "الأشعة الرقمية الحديثة فورية وتظهر على الشاشة في أجزاء من الثانية، وتوفر 80% من كمية الإشعاع مقارنة بأفلام التحميض القديمة.",
        "هندسة الأنسجة العظمية تعتمد على سقالات نانوية ثلاثية الأبعاد تُزرع في الفك وتتحلل لتُستبدل بعظم المريض الطبيعي.",
        "يمكن للأشعة ثلاثية الأبعاد تقييم مجرى التنفس وتحديد مناطق الانسداد للمساعدة في علاج انقطاع النفس النومي والشخير.",
        "الحشوات الحديثة تحتوي على جزيئات نانوية مضادة للبكتيريا تمنع التسوس الثانوي من الحدوث تحت الحشوة.",
        "أجهزة مطيافية الرنين المغناطيسي الصغيرة قيد التطوير لتصوير الأعصاب السنية الداخلية بدون أشعة سينية إطلاقاً.",
        "المواد السنية ذات 'الذاكرة الشكلية' تعود لشكلها الأصلي عند تعرضها لحرارة الفم لتسليط ضغط مدروس.",
        "الألياف الزجاجية المقواة بالراتنج تُستخدم كدعامات داخلية لبناء الأسنان المكسورة جداً بدلاً من المسامير المعدنية.",
        "برامج المحاكاة الشعاعية تسمح برسم مسار العصب السفلي الرئيسي قبل الزراعة بالمليمتر لتجنب أي إصابة عصبية للمريض.",
        "تقنية التصوير الحراري يمكنها تحديد مناطق الالتهاب في الفك بمجرد قياس التغيرات الطفيفة في درجات الحرارة.",
        "مادة MTA الحيوية كانت ثورة في طب الأسنان لقدرتها على إغلاق انثقابات الجذور والعمل في بيئة مبللة بالدم بنجاح تام.",
        "تكنولوجيا النانو أسهمت في إنتاج معاجين أسنان تسد الأقنية العاجية المجهرية لعلاج حساسية الأسنان المفرطة نهائياً.",
        "الذكاء الاصطناعي في برامج الأشعة يقوم بتلوين وتمييز الأكياس والأورام وتحديد كثافة العظم بالأرقام لتبسيط التشخيص.",
        "العيادة السنية الحديثة التي تعتمد جميع هذه التكنولوجيا، لا تعالج الألم فحسب، بل تصنع تجربة طبية فاخرة وخالية من التوتر.",
        "التصوير الرقمي يقلل من الحاجة لإعادة التصوير بسبب الأخطاء.",
        "الأشعة البانورامية تكشف الأسنان المنطمرة والأورام والخراجات.",
        "الحشوات البايوسيراميك تطلق أيونات الكالسيوم لتحفيز العظم.",
        "المواد الذكية تتفاعل مع البيئة الفموية لتقليل التسوس.",
        "الخلايا الجذعية السنية تستخدم حالياً في تجارب إعادة بناء العظم.",
        "النانوتكنولوجي في الحشوات يمنع الالتصاق البكتيري.",
        "الأشعة المقطعية المخروطية ضرورية لتخطيط الزراعة.",
        "التصوير بالرنين المغناطيسي للفك محدود الاستخدام بسبب حركة المريض.",
        "المواد المركبة النانوية أقوى وأكثر جمالية.",
        "الأجهزة المحمولة للتصوير داخل الفم سهلة الاستخدام.",
        "برامج المحاكاة تساعد في تعليم طلاب طب الأسنان.",
        "التصوير ثلاثي الأبعاد يكشف كسور الجذور الخفية.",
        "الحشوات الزجاجية الشاردة أيونية تطلق الفلورايد باستمرار.",
        "الألياف الزجاجية تستخدم في تثبيت الأسنان المخلخلة.",
        "المواد العظمية الاصطناعية تشبه العظم الطبيعي.",
        "أغشية الكولاجين تستخدم في تجديد اللثة والعظم.",
        "المواد السنية المتوافقة حيوياً لا تسبب التهابات.",
        "التصوير الرقمي يسهل مشاركة الصور بين الأطباء.",
        "تقنية CAD/CAM تعتمد على الماسحات الرقمية.",
        "المواد الحيوية الذكية هي مستقبل طب الأسنان."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<span class="num">${i+1}</span> ${f}`; container.appendChild(d); });
</script>
</body>
</html>
