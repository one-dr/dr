<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>إرشادات الدكتور محمد الأحمد - نصائح للأسنان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Tajawal',sans-serif;background:#fef9e6;color:#3a2c1f;padding:20px 16px 50px;}
        .container{max-width:1200px;margin:0 auto;}
        .header{text-align:center;margin-bottom:30px;}
        .header h1{background:#e9c46a;color:#2c3e2f;display:inline-block;padding:12px 30px;border-radius:60px;font-size:1.8rem;}
        .header p{margin-top:12px;color:#b67b1f;font-weight:500;}
        .tips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px;}
        .tip-card{background:white;border-radius:28px;padding:18px;box-shadow:0 8px 16px rgba(0,0,0,0.05);transition:0.2s;border-left:5px solid #e9c46a;}
        .tip-card:hover{transform:translateY(-5px);box-shadow:0 14px 24px rgba(0,0,0,0.1);background:#fffdf5;}
        .tip-number{background:#e9c46a;color:#2c3e2f;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:40px;font-weight:800;margin-bottom:12px;}
        .tip-text{font-size:0.95rem;line-height:1.55;color:#3a2c1f;}
        .back-btn{display:inline-flex;align-items:center;gap:8px;background:#0b2b3b;color:white;text-decoration:none;padding:10px 24px;border-radius:40px;margin-bottom:20px;font-weight:500;transition:0.2s;}
        .back-btn:hover{background:#e9c46a;color:#1e3a5f;}
        footer{text-align:center;margin-top:40px;color:#8a6e4b;font-size:0.75rem;}
        @media (max-width:600px){.tips-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة إلى المجلة الرئيسية</a>
    <div class="header">
        <h1><i class="fas fa-toothbrush"></i> إرشادات الدكتور محمد الأحمد</h1>
        <p>40 نصيحة ذهبية للحفاظ على أسنانك وابتسامتك</p>
    </div>
    <div class="tips-grid" id="tipsContainer"></div>
    <footer>نصائح عملية من عيادة الدكتور محمد الأحمد – طب الوقاية خير من العلاج</footer>
</div>
<script>
    const tips = [
        "فرش أسنانك مرتين يومياً على الأقل، صباحاً ومساءً، لمدة دقيقتين.",
        "استخدم فرشاة أسنان ناعمة لتجنب تآكل اللثة والمينا.",
        "استبدل فرشاة الأسنان كل 3 أشهر أو عند تآكل الشعيرات.",
        "استخدم معجون أسنان يحتوي على الفلورايد للحماية من التسوس.",
        "لا تفرش الأسنان بعنف لتجنب تآكل المينا وانحسار اللثة.",
        "استخدم خيط الأسنان يومياً لإزالة بقايا الطعام بين الأسنان.",
        "استعمل غسول فم مضاد للبكتيريا لتقليل البلاك ورائحة الفم.",
        "لا تتخطى تنظيف الأسنان قبل النوم، لأن البكتيريا تعمل أكثر أثناء الليل.",
        "شطف الفم بالماء بعد تناول الطعام إذا لم يتاح لك الفرشاة.",
        "قم بتدليك اللثة برفق أثناء التنظيف لتحفيز الدورة الدموية.",
        "قلل من تناول السكريات والحلويات، فهي سبب رئيسي للتسوس.",
        "تجنب المشروبات الغازية والمحلاة، لأنها تضر بالمينا.",
        "تناول الأطعمة الغنية بالكالسيوم مثل الحليب، الجبن، والزبادي.",
        "أكل الخضروات والفواكه الصلبة، مثل التفاح والجزر، يساعد على تنظيف الأسنان طبيعياً.",
        "شرب الماء بكثرة يحافظ على ترطيب الفم ويقلل نمو البكتيريا.",
        "تناول الأطعمة الغنية بفيتامين D لتقوية الأسنان والعظام.",
        "مضغ الأطعمة الغنية بالألياف يحفز إفراز اللعاب ويوازن حموضة الفم.",
        "الحد من الأطعمة المليئة بالنشويات المكررة التي تلتصق بالأسنان.",
        "إضافة الأغذية الغنية بالمغنيسيوم مثل المكسرات والبذور لصحة اللثة.",
        "تجنب الإفراط في الكافيين لأنه يقلل من إنتاج اللعاب الطبيعي.",
        "زيارة طبيب الأسنان مرة كل 6 أشهر للفحص والتنظيف الدوري.",
        "تنظيف الأسنان الاحترافي لإزالة البلاك والجير.",
        "استخدام مانع تسوس الأسنان (سيلانت) للأسنان الخلفية عند الأطفال والبالغين المعرضين للتسوس.",
        "معالجة أي تسوس صغير فوراً قبل أن يتفاقم.",
        "علاج اللثة الملتهبة بسرعة لتجنب أمراض اللثة المتقدمة.",
        "ارتداء واقي الأسنان أثناء الرياضات العنيفة.",
        "تجنب طحن الأسنان أثناء النوم باستخدام واقٍ ليلي إذا لزم الأمر.",
        "تجنب التدخين لأنه يضعف اللثة ويؤدي إلى تصبغ الأسنان.",
        "الحد من شرب الكحول لأنه يزيد من جفاف الفم ويزيد التسوس.",
        "تعلم تنظيف الأسنان بعد كل وجبة رئيسية أو بعد تناول السكريات.",
        "استخدام زيت جوز الهند للغرغرة اليومية (سحب الزيت) لتقليل البكتيريا.",
        "مضغ القرنفل عند الشعور بألم الأسنان كمسكن طبيعي مؤقت.",
        "شاي البابونج كمضمضة لتقليل الالتهاب والتهدئة.",
        "استخدام القرفة والزيوت العطرية المخففة لتسكين الألم مؤقتاً.",
        "مضغ أوراق النعناع الطازجة لتعطير الفم وقتياً.",
        "الشاي الأخضر للغرغرة لخصائصه المضادة للبكتيريا.",
        "الكركم كمضاد التهاب طبيعي للثة والمينا.",
        "مضغ البقدونس لتقليل رائحة الفم الكريهة.",
        "الغرغرة بالماء والملح لتطهير الفم وقت الطوارئ.",
        "شاي الميرمية لتقليل التهابات اللثة."
    ];
    const container = document.getElementById('tipsContainer');
    tips.forEach((tip, i) => {
        const card = document.createElement('div');
        card.className = 'tip-card';
        card.innerHTML = `<div class="tip-number">${i+1}</div><div class="tip-text">💡 ${tip}</div>`;
        container.appendChild(card);
    });
</script>
</body>
</html>
