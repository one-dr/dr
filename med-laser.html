<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب الأسنان بالليزر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#1a1a2e;font-family:'Tajawal';padding:20px;color:#ddd;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#ff6f61;font-size:1.9rem;}
        .sub{text-align:center;color:#ff8c7a;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:#16213e;border-radius:24px;padding:18px;border-left:4px solid #ff6f61;}
        .num{color:#ff6f61;font-weight:700;margin-left:8px;}
        footer{text-align:center;margin-top:35px;color:#6c7a89;}
    </style>
</head>
<body>
<div class="container">
    <h1>🔆 طب الأسنان بالليزر</h1>
    <div class="sub">40 حقيقة عن تقنيات الليزر الثورية في طب الأسنان</div>
    <div class="grid" id="factsGrid"></div>
    <footer>علاج بدون ألم، بدون صوت، بدون خوف</footer>
</div>
<script>
    const facts = [
        "ليزر الإيربيوم يستطيع حفر الأسنان وإزالة التسوس بقوة الضوء والماء وبدون إبرة تخدير في كثير من الحالات.",
        "جهاز الليزر لا يصدر أي أصوات مزعجة أو اهتزازات، مما يقضي على فوبيا طبيب الأسنان الناتجة عن صوت الحفارة.",
        "ليزر الدايود يُستخدم في الجراحات اللثوية المعقدة دون أي نزيف قطرة دم واحدة، لأنه يخثر الأوعية الدموية فوراً.",
        "استخدام الليزر في تعقيم قنوات الجذور يقتل 99.9% من البكتيريا المقاومة للمضادات الحيوية داخل السن.",
        "تقنية الليزر الحيوي تستخدم الضوء البارد لتحفيز الخلايا على التئام الجروح وتخفيف الألم بعد الخلع.",
        "يمكن استخدام الليزر لإزالة التصبغات الداكنة من اللثة (توريد اللثة) في جلسة واحدة مدتها 15 دقيقة.",
        "شعاع الليزر يميز بين النسيج المتسوس والنسيج السليم، فيزيل التسوس فقط ويحافظ على صحة السن الباقي.",
        "معالجة الحساسية السنية تتم بتسليط الليزر على مسام السن المفتوحة لإغلاقها نهائياً.",
        "جراحة كشف الانطمار لتقويم الأسنان بالليزر لا تتطلب أي خياطة وتشفى خلال يومين فقط.",
        "الليزر يُستخدم في استئصال الأورام الحميدة في الفم بسرعة وبدون ألم يذكر بعد العملية.",
        "تقنية تنشيط التبييض بالليزر تكسر الروابط الكيميائية للبقع الصفراء أسرع بـ 10 مرات من التبييض العادي.",
        "الليزر يكشف التسوسات المخفية جداً عبر قياس التغير في الفلورة الضوئية لمينا السن.",
        "معالجة القرحات الفموية والفيروسية (قرحة الزكام) بالليزر يوقف ألمها فوراً ويسرع شفاءها.",
        "يمكن استخدام الليزر لتحرير رباط اللسان المربوط للأطفال الرضع بدون جراحة تقليدية لتسهيل الرضاعة.",
        "الليزر يُحدث تعقيماً عميقاً في الجيوب اللثوية حول الزرعات السنية لإنقاذها من الفشل.",
        "التعديل التجميلي لحواف اللثة بالليزر يعطي نتائج فورية ولا يترك ندوباً كما يفعل المشرط الجراحي.",
        "النبضات الضوئية لليزر سريعة جداً لدرجة أن عصب السن لا يملك الوقت لإرسال إشارة الألم للدماغ.",
        "الليزر يحفز نمو العظم المفقود حول الأسنان عبر تنشيط الخلايا البانية للعظم.",
        "خيوط الليزر المرنة تستطيع الدخول في أقنية العصب الملتوية جداً والتي لا تصلها الأدوات المعدنية.",
        "الليزر في طب الأسنان آمن تماماً، ولا يصدر أي إشعاعات أيونية مضرة بالخلايا البشرية.",
        "الليزر يقلل الحاجة إلى التخدير الموضعي في 80% من حالات حفر التسوس.",
        "المرضى يفضلون الليزر بسبب عدم وجود اهتزاز أو ضغط.",
        "الليزر يسرع من شفاء الأنسجة الرخوة بنسبة 50% مقارنة بالجراحة التقليدية.",
        "ليزر الإربيوم:YAG يمكنه قطع العظام بدقة في جراحات الفك.",
        "الليزر يستخدم في علاج الالتهابات حول زرعات الأسنان (Peri-implantitis).",
        "علاج اللثة بالليزر يقلل من عمق الجيوب اللثوية بشكل كبير.",
        "الليزر يمكن استخدامه في تبييض الأسنان الحيوية واللاحيوية.",
        "لا يحتاج الليزر إلى تخدير في معظم الحالات السطحية.",
        "جراحات اللثة بالليزر تلتئم دون ألم يذكر.",
        "الليزر يقتل البكتيريا المسببة لرائحة الفم الكريهة مباشرة.",
        "تقنية (Laser-Assisted New Attachment Procedure) تعيدattachment اللثة للسن.",
        "الليزر يمكنه إزالة الأورام الليفية الحميدة في دقائق.",
        "علاج القروح السرطانية بالليزر يقلل الألم ويمنع تكرارها.",
        "الليزر يساعد في فتح قنوات الجذر المسدودة بأدوات مكسورة.",
        "الليزر يقلل من نزيف ما بعد الجراحة.",
        "يمكن استخدام الليزر في رفع الجيب الفكي قبل الزراعة.",
        "الليزر آمن حتى على الأطفال والنساء الحوامل.",
        "تقنية الـ (Laser Frenectomy) تستخدم لتحرير اللجام.",
        "الليزر يقضي على البكتيريا في جيوب اللثة العميقة.",
        "مستقبل الليزر: أجهزة ليزر محمولة لتشخيص التسوس في المنزل."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<span class="num">${i+1}.</span> ${f}`; container.appendChild(d); });
</script>
</body>
</html>
