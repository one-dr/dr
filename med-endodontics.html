<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المداواة اللبية وعلاج الجذور الدقيق</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f4f4f0;font-family:'Tajawal';padding:20px;color:#2d3e40;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#3a6b6b;font-size:1.9rem;}
        .sub{text-align:center;color:#5f8b8b;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:white;border-radius:28px;padding:18px;box-shadow:0 4px 10px rgba(0,0,0,0.05);border-left:4px solid #3a6b6b;}
        .num{color:#3a6b6b;font-weight:700;margin-left:8px;}
        footer{text-align:center;margin-top:35px;color:#6e8f8f;}
    </style>
</head>
<body>
<div class="container">
    <h1>🔬 المداواة اللبية وعلاج الجذور الدقيق</h1>
    <div class="sub">40 حقيقة عن إنقاذ الأسنان التالفة</div>
    <div class="grid" id="factsGrid"></div>
    <footer>الحفاظ على السن الطبيعي هو الهدف الأول</footer>
</div>
<script>
    const facts = [
        "سحب العصب الحديث يتم في جلسة واحدة فقط في معظم الحالات بفضل الأجهزة الدوارة المعقمة.",
        "الميكروسكوب الجراحي السني يكبر القنوات الجذرية حتى 25 ضعفاً، مما يسمح باكتشاف القنوات المخفية والضيقة جداً.",
        "جهاز تحديد الذروة الإلكتروني يحدد نهاية جذر السن بدقة تتجاوز 95% دون الحاجة للأشعة في كل خطوة.",
        "العصب السني يحتوي على أوعية دموية ونسيج ضام، وليس مجرد سلك كما يتخيل البعض.",
        "أدوات الحفر اللبية الحديثة مصنوعة من التيتانيوم المرن للوصول إلى الجذور المنحنية دون أن تنكسر.",
        "حشو الجذور الحراري ثلاثي الأبعاد يُذيب مادة الجوتاپيركا لتملأ كافة التفرعات الجانبية المجهرية داخل السن.",
        "السن المسحوب عصبه يفقد ترطيبه الداخلي ويصبح هشاً ومعرضاً للكسر، لذلك يحتاج إلى تغليف (تاج) لحمايته.",
        "البايوسيراميك هي مواد حشو حديثة تحفز العظم المحيط بالجذر على الالتئام وتشكيل سد منيع ضد البكتيريا.",
        "ألم العصب لا يُحتمل لأنه محاط بجدران صلبة (السن)، وعندما يلتهب يتمدد في مكان مغلق فيضغط بقوة على نهايات الألم.",
        "الخراج السني هو تجمع للقيح في نهاية الجذر نتيجة موت العصب وبدء البكتيريا في تدمير العظم.",
        "يمكن إعادة علاج السن المسحوب عصبه سابقاً وإصلاح الأخطاء القديمة بدلاً من خلعه، بنسبة نجاح عالية جداً.",
        "جهاز الألتراسونيك يُستخدم لإزالة التكلسات وإخراج الأدوات المكسورة من داخل القنوات.",
        "أحياناً يكون التسوس عميقاً جداً ولكن العصب يدافع عن نفسه ببناء طبقة 'عاج ثانوي' تبعده عن منطقة الخطر.",
        "الغسيل الكيميائي المستمر داخل السن (بسوائل معقمة مثل هيبوكلوريت الصوديوم) هو العامل الأهم لنجاح علاج العصب.",
        "تغير لون السن للرمادي الفاتح بعد صدمة أو ضربة يعني أن العصب قد نزف ومات داخلياً ويحتاج لعلاج.",
        "بعض الأسنان الخلفية (الأرحاء) قد تحتوي على 4 أو 5 قنوات، وإهمال إحداها يؤدي لفشل العلاج.",
        "الجراحة الذروية المجهرية تتم عن طريق اللثة لقص نهاية الجذر المريض وإغلاقه بحشوة عكسية.",
        "التخدير الرقمي الحديث يقوم بحقن البنج ببطء شديد يتم التحكم فيه حاسوبياً لضمان عدم شعور المريض بأي ألم.",
        "الحاجز المطاطي ضرورة حتمية في سحب العصب، فهو يعزل السن تماماً عن اللعاب والبكتيريا ويحمي المريض.",
        "الأسنان المعالجة لبياً بنجاح وتغليفها بشكل صحيح، يمكن أن تبقى في فم المريض مدى الحياة كأنها أسنان حية.",
        "علاج العصب لا يسبب ألماً بعد الجلسة سوى حساسية بسيطة لعدة أيام.",
        "نسبة نجاح علاج العصب تصل إلى 95% في الأيدي الماهرة.",
        "الميكروسكوب الجراحي يزيد نسبة النجاح في الحالات الصعبة.",
        "علاج العصب للأطفال يختلف عن البالغين في الأسنان اللبنية.",
        "الأسنان الأمامية غالباً لها قناة واحدة، والأضراس 3-4 قنوات.",
        "العدوى حول الجذر قد لا تظهر أعراضاً لسنوات.",
        "العلاج بالبايوسيراميك يعطي إغلاقاً بيولوجياً ممتازاً.",
        "يمكن استخدام الليزر في تعقيم القنوات بدلاً من المحاليل.",
        "إعادة علاج العصب ممكن بنجاح يصل 80%.",
        "الجراحة الذروية تتم عندما يفشل علاج العصب التقليدي.",
        "الألم أثناء المضغ بعد علاج العصب قد يعني وجود شرخ في الجذر.",
        "تاج السن بعد العصب يحمي من الكسر بنسبة 90%.",
        "يمكن تبييض السن المعالج لبيًّا إذا تغير لونه.",
        "علاج العصب أثناء الحمل آمن في الثلث الثاني.",
        "مرضى سيولة الدم يمكنهم علاج العصب بأمان.",
        "الحاجز المطاطي يمنع ابتلاع الأدوات الصغيرة.",
        "أحدث الأجهزة الإلكترونية تحدد طول القناة بدقة.",
        "الأدوات الدوارة تجعل العلاج أسرع وأكثر راحة.",
        "تنظيف القنوات بالماء المقطر والأكسجين النشط.",
        "علاج العصب يحافظ على السن في الفم لسنوات طويلة."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<span class="num">${i+1}.</span> ${f}`; container.appendChild(d); });
</script>
</body>
</html>
