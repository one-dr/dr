<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ماذا أجاب الدكتور محمد الأحمد؟ - أسئلة وأجوبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Tajawal',sans-serif;background:#f0f7ff;color:#1e2a3e;padding:20px 16px 50px;}
        .container{max-width:1100px;margin:0 auto;}
        .header{text-align:center;margin-bottom:30px;}
        .header h1{background:#005f73;color:white;display:inline-block;padding:12px 30px;border-radius:60px;font-size:1.8rem;}
        .header p{margin-top:12px;color:#2c6e6e;font-weight:500;}
        .qa-grid{display:flex;flex-direction:column;gap:16px;}
        .qa-card{background:white;border-radius:32px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,0.05);transition:0.2s;border-right:6px solid #2a9d8f;}
        .qa-card:hover{transform:translateX(-4px);box-shadow:0 12px 22px rgba(0,0,0,0.1);}
        .question{background:#e9f5f0;padding:18px 22px;font-weight:800;font-size:1.05rem;color:#005f73;display:flex;align-items:center;gap:12px;}
        .question i{font-size:1.3rem;color:#2a9d8f;}
        .answer{background:#fff;padding:16px 22px;font-size:0.95rem;line-height:1.6;color:#2c3e2f;border-top:1px solid #e0ece5;}
        .back-btn{display:inline-flex;align-items:center;gap:8px;background:#0b2b3b;color:white;text-decoration:none;padding:10px 24px;border-radius:40px;margin-bottom:20px;font-weight:500;transition:0.2s;}
        .back-btn:hover{background:#e9c46a;color:#1e3a5f;}
        footer{text-align:center;margin-top:40px;color:#5a7a7a;font-size:0.75rem;}
        @media (max-width:600px){.question{font-size:0.95rem;padding:14px 18px;}.answer{padding:14px 18px;}}
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة إلى المجلة الرئيسية</a>
    <div class="header">
        <h1><i class="fas fa-comments"></i> ماذا أجاب الدكتور محمد الأحمد؟</h1>
        <p>40 سؤالاً شائعاً عن الأسنان – إجابات مختصرة ومفيدة</p>
    </div>
    <div class="qa-grid" id="qaContainer"></div>
    <footer>أسئلة المرضى الحقيقية – أجاب عليها الدكتور محمد الأحمد | العيادة السنية الحديثة</footer>
</div>
<script>
    const qaList = [
        { q: "كم مرة يجب أن أنظف أسناني يومياً؟", a: "يوصى بتنظيف الأسنان مرتين يومياً على الأقل، صباحاً ومساءً، مع استخدام خيط الأسنان مرة يومياً." },
        { q: "هل من الضروري استخدام معجون أسنان بالفلورايد؟", a: "نعم، الفلورايد يساعد على تقوية المينا ويقلل من خطر التسوس بشكل كبير." },
        { q: "كم مرة يجب تغيير فرشاة الأسنان؟", a: "كل 3 أشهر تقريباً، أو عند تآكل شعيرات الفرشاة." },
        { q: "هل الفرشاة الكهربائية أفضل من اليدوية؟", a: "كلاهما فعالان إذا استخدمت بشكل صحيح، لكن الفرشاة الكهربائية قد تنظف أكثر دقة للأسنان والمناطق الصعبة." },
        { q: "هل يجب تنظيف اللسان؟", a: "نعم، تنظيف اللسان يقلل البكتيريا ويمنع رائحة الفم الكريهة." },
        { q: "هل الغرغرة بالماء كافية؟", a: "الغرغرة تساعد مؤقتاً، لكنها لا تغني عن تنظيف الأسنان بالفرشاة والخيط." },
        { q: "هل يمكن تنظيف الأسنان بعد كل وجبة؟", a: "نعم، خصوصاً بعد الوجبات السكرية، مع مراعاة عدم فرش الأسنان مباشرة بعد المشروبات الحمضية لتجنب تآكل المينا." },
        { q: "ما سبب تسوس الأسنان؟", a: "التسوس ينتج عن البكتيريا التي تتحلل من السكريات والنشويات، مكونة أحماض تهاجم المينا." },
        { q: "هل التسوس مؤلم دائماً؟", a: "ليس بالضرورة، في البداية قد يكون بدون ألم، لكن مع تفاقم التسوس يظهر الألم." },
        { q: "ما الفرق بين الحشوة البيضاء والحشوة الفضية؟", a: "الحشوة البيضاء (كمبوزيت) جمالية وتندمج مع لون السن، والحشوة الفضية (أمالغم) أقوى لكنها ملحوظة بصرياً." },
        { q: "هل يمكن منع التسوس نهائياً؟", a: "لا يمكن منعه بالكامل، لكن النظافة الجيدة، الفلورايد، وتقليل السكريات تقلل فرصه بشكل كبير." },
        { q: "ما هو التسوس السطحي والعميق؟", a: "السطحي يؤثر على المينا فقط، والعميق يصل إلى العاج أو لب السن ويحتاج غالباً علاجاً عاجلاً." },
        { q: "هل الحشوات مؤقتة أم دائمة؟", a: "بعض الحشوات مؤقتة (لتحضير السن)، والبعض الآخر دائم حسب نوع المادة وطبيعة السن." },
        { q: "هل يجب إزالة التسوس فوراً؟", a: "نعم، التأخير يزيد الضرر ويؤدي إلى ألم، التهاب، أو فقدان السن." },
        { q: "ما سبب التهاب اللثة؟", a: "تراكم البلاك، التدخين، نقص الفيتامينات، بعض الأمراض مثل السكري." },
        { q: "ما الفرق بين التهاب اللثة ومرض اللثة؟", a: "التهاب اللثة (Gingivitis) قابل للعلاج، أما مرض اللثة (Periodontitis) يؤثر على العظام ويؤدي لفقدان الأسنان." },
        { q: "هل نزيف اللثة طبيعي؟", a: "لا، نزيف اللثة أثناء تنظيف الأسنان علامة على التهاب ويحتاج علاج." },
        { q: "كيف يمكن الوقاية من التهاب اللثة؟", a: "تنظيف الأسنان بالفرشاة والخيط، غسول مضاد للبكتيريا، فحص دوري لدى طبيب الأسنان." },
        { q: "هل يمكن علاج اللثة الملتهبة بالأعشاب؟", a: "يمكن استخدام غسول البابونج، الميرمية، أو زيت القرنفل مؤقتاً لتخفيف الالتهاب، لكن العلاج عند طبيب الأسنان ضروري." },
        { q: "هل التدخين يؤثر على اللثة؟", a: "نعم، يضعف الدورة الدموية ويزيد خطر التهابات اللثة وتساقط الأسنان." },
        { q: "ما سبب حساسية الأسنان؟", a: "انحسار اللثة، تآكل المينا، التسوس، أو مشاكل في حشوات الأسنان." },
        { q: "كيف أتعامل مع حساسية الأسنان؟", a: "استخدام معجون أسنان مخصص للأسنان الحساسة، تجنب المشروبات شديدة البرودة أو الحرارة، زيارة طبيب الأسنان إذا استمر الألم." },
        { q: "هل الحساسية مؤقتة أم دائمة؟", a: "يمكن أن تكون مؤقتة بعد بعض العلاجات أو تراكم التسوس، لكنها قد تصبح دائمة إذا لم تعالج السبب." },
        { q: "متى يحتاج الشخص لتقويم الأسنان؟", a: "عند وجود ازدحام، بروز الأسنان، صعوبة في المضغ، أو مشاكل في الفك." },
        { q: "هل التقويم مؤلم؟", a: "يمكن الشعور بعدم ارتياح أو ألم بسيط في الأيام الأولى، لكنه مؤقت." },
        { q: "كم مدة العلاج بالتقويم عادة؟", a: "تتراوح بين سنة إلى ثلاث سنوات حسب الحالة." },
        { q: "هل يمكن تقويم الأسنان للكبار؟", a: "نعم، العمر ليس عائقاً، لكن العلاج قد يستغرق وقتاً أطول مقارنة بالأطفال." },
        { q: "هل التقويم يؤثر على نظافة الأسنان؟", a: "نعم، يحتاج التقويم عناية إضافية بالفرشاة والخيط وغسول الفم." },
        { q: "متى تظهر الأسنان اللبنية؟", a: "عادة بين 6 أشهر إلى سنة واحدة." },
        { q: "متى تظهر الأسنان الدائمة؟", a: "تبدأ من عمر 6 سنوات تقريباً." },
        { q: "هل سقوط الأسنان اللبنية طبيعي؟", a: "نعم، جزء من النمو الطبيعي قبل ظهور الأسنان الدائمة." },
        { q: "هل الحشوات للأطفال آمنة؟", a: "نعم، الحشوات الملائمة للأطفال آمنة وتمنع التسوس من التفاقم." },
        { q: "كيف أعتني بأسنان الأطفال الصغيرة؟", a: "تنظيف الأسنان مرتين يومياً، استخدام فرشاة صغيرة، الحد من السكريات، وزيارات منتظمة للطبيب." },
        { q: "هل شرب الماء يحمي الأسنان؟", a: "نعم، الماء يغسل بقايا الطعام ويقلل من حموضة الفم." },
        { q: "هل العلكة الخالية من السكر مفيدة؟", a: "نعم، تحفز إفراز اللعاب وتحمي الأسنان بعد الوجبات." },
        { q: "هل التدخين يسبب تسوس الأسنان؟", a: "نعم، يزيد التدخين من تراكم البلاك ويضعف صحة اللثة." },
        { q: "هل الكافيين يؤثر على الأسنان؟", a: "الإفراط في الكافيين يمكن أن يسبب جفاف الفم، مما يزيد خطر التسوس." },
        { q: "كيف أقي نفسي من رائحة الفم الكريهة؟", a: "تنظيف الأسنان واللسان، استخدام غسول مضاد للبكتيريا، وتجنب السكريات الزائدة." },
        { q: "هل الأسنان البيضاء طبيعية دائماً؟", a: "لا، لون الأسنان الطبيعي يختلف حسب الوراثة والعمر، لكن النظافة تقلل التصبغ." },
        { q: "هل قضم الثلج يؤثر على الأسنان؟", a: "نعم، يمكن أن يسبب تشقق الأسنان أو كسر الحشوات." }
    ];
    const container = document.getElementById('qaContainer');
    qaList.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'qa-card';
        card.innerHTML = `
            <div class="question"><i class="fas fa-question-circle"></i> ${item.q}</div>
            <div class="answer"><i class="fas fa-stethoscope"></i> <strong>الدكتور محمد الأحمد:</strong> ${item.a}</div>
        `;
        container.appendChild(card);
    });
</script>
</body>
</html>
