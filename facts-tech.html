<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلومات طبية تقنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0b1a2a;font-family:'Tajawal';padding:20px;color:#ddd;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#0ff;font-size:1.9rem;}
        .sub{text-align:center;color:#8af;margin-bottom:25px;}
        .grid{display:flex;flex-direction:column;gap:12px;}
        .tech-item{background:#102433;border-radius:20px;padding:14px 18px;border-left:3px solid #0ff;transition:0.2s;}
        .tech-item:hover{background:#1a2f44;}
        .num{color:#0ff;font-weight:800;margin-left:10px;}
        footer{text-align:center;margin-top:35px;color:#5a7a9a;}
    </style>
</head>
<body>
<div class="container">
    <h1>⚙️ معلومات طبية تقنية</h1>
    <div class="sub">أحدث ما توصل إليه العلم في طب الأسنان</div>
    <div class="grid" id="techList"></div>
    <footer>تقنيات CAD/CAM، الليزر، الذكاء الاصطناعي</footer>
</div>
<script>
    const facts = [
        "الزيركون المستخدم في التيجان هو نوع من السيراميك فائق الصلابة.",
        "تقنية CAD/CAM تسمح بصناعة سن كامل في أقل من ساعة.",
        "ابتسامة هوليوود ليست مجرد بياض، بل تناسق في الحجم والزوايا.",
        "خلع ضرس العقل لا يؤثر إطلاقاً على نسبة ذكاء الإنسان.",
        "رائحة الفم قد تكون مؤشراً على مشاكل في الكبد أو الكلى.",
        "الضغط على الأسنان (الصرير) أثناء النوم يسبب صداعاً مزمناً.",
        "الأسنان الحساسة ناتجة عن تراجع اللثة وانكشاف جذور السن.",
        "التقويم الشفاف (Invisalign) يمكنه تحريك الأسنان بدقة الميكرومتر.",
        "خيوط الجراحة المستخدمة في الفم غالباً ما تذوب تلقائياً.",
        "زراعة الأسنان تحفز عظم الفك وتمنعه من الضمور.",
        "الماسح الفموي ألغى الحاجة لطبعات العجين المزعجة.",
        "الذكاء الاصطناعي يقرأ الأشعة ويكتشف التسوس المخفي.",
        "تصميم الابتسامة الرقمي DSD يتيح رؤية النتيجة قبل البدء.",
        "الطابعات ثلاثية الأبعاد تطبع التيجان والجسور المؤقتة في دقائق.",
        "الكاميرات الفموية تصور الأسنان بتكبير 100 ضعف.",
        "المطابق اللوني الرقمي يقرأ لون السن بدقة.",
        "الواقع المعزز AR يُستخدم في تدريب الأطباء.",
        "الزرعات الموجهة حاسوبياً تتم بدون شقوق جراحية واسعة.",
        "البلازما الغنية بالصفائح الدموية PRP تسرع التئام الجروح.",
        "الزرعات القصيرة تستخدم لتجنب الجراحات المعقدة.",
        "زرعات الزيركونيا خالية من المعادن لمن يعانون حساسية التيتانيوم.",
        "الليزر في طب الأسنان يزيل التسوس بدون صوت ولا اهتزاز.",
        "ليزر الدايود يستخدم في جراحات اللثة بدون نزيف.",
        "الليزر الحيوي LLLT يحفز التئام الجروح.",
        "تقنية الـ All-on-4 تعوض فك كامل بـ 4 زرعات في يوم واحد.",
        "الزراعة الفورية تحافظ على بنية اللثة الطبيعية.",
        "رفع الجيب الفكي لزيادة كثافة العظم للزرعات.",
        "الزرعات لا تتعرض للتسوس أبداً.",
        "التصوير المقطعي المخروطي CBCT إشعاع أقل 90%.",
        "الحشوات الذكية تطلق الكالسيوم لحماية السن.",
        "الخلايا الجذعية في الأسنان اللبنية يمكن حفظها.",
        "المواد النشطة حيوياً تندمج مع السن.",
        "طباعة الأنسجة الحيوية لطباعة أسنان حية قيد التطوير.",
        "الأشعة الرقمية توفر 80% من الإشعاع.",
        "النانو تكنولوجي في معاجين الأسنان لعلاج الحساسية.",
        "الروبوتات السنية تقوم بزراعات دقيقة.",
        "تقنية التصوير الحراري تكشف الالتهاب بالفك."
    ];
    const container = document.getElementById('techList');
    facts.forEach((f,i)=>{
        const div = document.createElement('div');
        div.className = 'tech-item';
        div.innerHTML = `<span class="num">${i+1}.</span> ${f}`;
        container.appendChild(div);
    });
</script>
</body>
</html>
