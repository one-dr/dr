<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاريخ طب الأسنان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f3ede8;font-family:'Tajawal';padding:20px;}
        .container{max-width:1000px;margin:auto;}
        h1{text-align:center;color:#6b4226;border-bottom:3px solid #c49a6c;display:inline-block;width:100%;padding-bottom:8px;}
        .timeline{display:flex;flex-direction:column;gap:12px;margin-top:30px;}
        .event{background:white;border-radius:20px;padding:16px 20px;box-shadow:0 2px 6px rgba(0,0,0,0.05);border-right:8px solid #c49a6c;}
        .year{font-weight:800;color:#a45d2e;margin-left:12px;}
        footer{text-align:center;margin-top:35px;color:#7a5a4a;}
    </style>
</head>
<body>
<div class="container">
    <h1>📜 تاريخ طب الأسنان (رحلة عبر الزمن)</h1>
    <div class="timeline" id="factsList"></div>
    <footer>من الحلاقين إلى الروبوتات - تطور مذهل</footer>
</div>
<script>
    const facts = [
        "قدماء المصريين كانوا يستخدمون 'معجون أسنان' من رماد الحوافر وقشر البيض.",
        "أول فرشاة أسنان في التاريخ كانت عبارة عن 'غصن شجر' يمضغ طرفه.",
        "الصينيون هم أول من اخترع فرشاة الأسنان ذات الشعيرات (من شعر الخنازير).",
        "الحلاقون في العصور الوسطى هم من كانوا يقومون بخلع الأسنان.",
        "أول طبيب أسنان في التاريخ مسجل اسمه هو 'حسي رع' من مصر القديمة.",
        "قدماء اليونان استخدموا أسلاك الذهب لربط الأسنان المتحركة.",
        "أول معجون أسنان 'حديث' تم بيعه في برطمانات وليس أنابيب.",
        "المايا كانوا يزينون أسنانهم بالأحجار الكريمة عبر ثقبها يدوياً.",
        "الرومان كانوا يستخدمون 'البول' لتبييض أسنانهم (بسبب غناه بالأمونيا)!",
        "أول كلية لطب الأسنان في العالم تأسست عام 1840 في بالتيمور.",
        "في القرن الـ18، لم يكن هناك طبيب أسنان بل 'الحلاق' هو من يخلع الأسنان.",
        "الفراعنة اخترعوا أول معجون أسنان من رماد حوافر الثيران وقشر البيض.",
        "بعد معركة واترلو، تم خلع أسنان الجنود القتلى لصنع أطقم للأثرياء.",
        "أول فرشاة أسنان حديثة اخترعها الإنجليزي ويليام أديس داخل السجن.",
        "القراصنة كانوا يستبدلون الأسنان المفقودة بالذهب أو الخشب.",
        "حضارة الإتروسكان ربطوا الأسنان بأسلاك ذهبية.",
        "الملكة إليزابيث الأولى أحبت السكر حتى اسودت أسنانها فأصبح سواد الأسنان موضة.",
        "حسي رع هو أول طبيب أسنان مسجل في التاريخ.",
        "الفايكنج كانوا يبردون أسنانهم الأمامية بشكل خطوط أفقية لتخويف الأعداء.",
        "القديسة أبولونيا هي شفيعة أطباء الأسنان.",
        "في العصور الوسطى اعتقدوا أن ألم الأسنان سببه دودة تحفر داخل السن.",
        "اليابان القديمة: النساء المتزوجات يصبغن أسنانهن بالأسود (أوهاجورو) للجمال.",
        "الرومان الأثرياء استوردوا البول من البرتغال للمضمضة.",
        "أول طقم أسنان لجورج واشنطن كان من عاج الفيل وأسنان بشرية.",
        "اختراع الكرسي القابل للاتكاء لطب الأسنان عام 1858.",
        "أول استخدام للتخدير الموضعي في طب الأسنان عام 1884 بالكوكايين.",
        "اختراع آلة الحفر الهوائية عام 1950.",
        "أول زراعة أسنان ناجحة تمت عام 1965 بواسطة برانيمارك.",
        "ظهور تقنية الليزر في طب الأسنان عام 1990.",
        "أول تقويم شفاف (Invisalign) عام 1997.",
        "أول طباعة ثلاثية الأبعاد لتاج سني عام 2010.",
        "استخدام الذكاء الاصطناعي في تشخيص التسوس عام 2018.",
        "اختراع فرشاة الأسنان الكهربائية عام 1954.",
        "أول معجون أسنان بالفلورايد طرح عام 1955.",
        "تأسيس أول نقابة لأطباء الأسنان في العالم عام 1840.",
        "أول استخدام للأشعة السينية في طب الأسنان عام 1896.",
        "أول عيادة أسنان متنقلة في التاريخ ظهرت عام 1900."
    ];
    const container = document.getElementById('factsList');
    facts.forEach((f,i)=>{
        const div = document.createElement('div');
        div.className = 'event';
        div.innerHTML = `<span class="year">📅 حقيقة ${i+1}:</span> ${f}`;
        container.appendChild(div);
    });
</script>
</body>
</html>
