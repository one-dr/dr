<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب أسنان الأطفال الوقائي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#fff9e6;font-family:'Tajawal';padding:20px;color:#4a3b2c;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#f4a261;font-size:1.9rem;}
        .sub{text-align:center;color:#e76f51;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:white;border-radius:28px;padding:18px;box-shadow:0 6px 12px rgba(0,0,0,0.05);border-bottom:4px solid #f4a261;}
        .num{background:#f4a261;color:white;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:30px;margin-left:10px;}
        footer{text-align:center;margin-top:35px;color:#b8865b;}
    </style>
</head>
<body>
<div class="container">
    <h1>👶 طب أسنان الأطفال الوقائي</h1>
    <div class="sub">40 حقيقة لابتسامة صحية تدوم مدى الحياة</div>
    <div class="grid" id="factsGrid"></div>
    <footer>الاستثمار في أسنان الأطفال = صحة مستقبلية</footer>
</div>
<script>
    const facts = [
        "الأسنان اللبنية ليست مؤقتة فقط، بل هي حافظات مسافة طبيعية توجه الأسنان الدائمة للظهور في مكانها الصحيح.",
        "التسوس المبكر عند الأطفال (تسوس الرضاعة) يحدث بسبب ترك زجاجة الحليب في فم الطفل أثناء نومه.",
        "الفلورايد الموضعي يُدهن على أسنان الأطفال لتقوية المينا ومنع التسوس بنسبة تصل إلى 40%.",
        "المواد السادة للشقوق (سيلانتس) هي طلاء بلاستيكي رقيق يوضع على سطح الأضراس لسد الأخاديد العميقة ومنع تجمع الطعام بها.",
        "الأطفال لا يملكون المهارة الحركية الكافية لتفريش أسنانهم بفعالية، لذلك يجب على الأهل الإشراف عليهم حتى سن الثامنة.",
        "خلع السن اللبني قبل أوانه يؤدي لميلان الأسنان المجاورة وإغلاق الفراغ، مما يسبب انطمار السن الدائم تحت العظم.",
        "حافظ المسافة الصناعي يوضع مكان السن اللبني المخلوع للحفاظ على مكان السن الدائم ومنع تزاحم الأسنان مستقبلاً.",
        "علاج عصب الأسنان اللبنية (بتر اللب) مختلف عن البالغين، ويُحافظ على جزء من العصب لإبقاء السن حياً قدر الإمكان.",
        "الغاز الضاحك (أكسيد النيتروز) آمن جداً للأطفال، يزيل الخوف والتوتر ويجعل العلاج تجربة ممتعة وهادئة.",
        "أول زيارة لطبيب الأسنان يجب أن تكون عند ظهور أول سن في الفم (حوالي 6 أشهر) أو في عيد ميلاد الطفل الأول.",
        "امتصاص الإصبع أو اللهاية بعد سن الرابعة يسبب تشوهات في سقف الحلق وبروز الأسنان العلوية وتراجع الفك السفلي.",
        "أسنان الأطفال الدائمة الأمامية تنمو بحواف متعرجة تسمى (Mamelons) تتآكل وتتسطح طبيعياً مع مرور الوقت والمضغ.",
        "معجون الأسنان للأطفال تحت سن 3 سنوات يجب أن يكون بحجم 'حبة الرز' لتجنب ابتلاع كميات زائدة من الفلورايد.",
        "مادة الـ SDF (فلوريد الفضة الماسي) يمكن دهنها على التسوس فتوقفه تماماً وتحوله للون الأسود دون الحاجة للحفر.",
        "التخدير الموضعي للأطفال يترافق دائماً بجل مخدر بنكهات الفواكه لتخدير اللثة قبل وضع الإبرة الدقيقة.",
        "كسور الأسنان الأمامية لدى الأطفال شائعة جداً، والاحتفاظ بالجزء المكسور في الحليب يمكن الطبيب من إعادة لصقه.",
        "التنفس من الفم عند الأطفال (بسبب اللحميات) يؤدي لجفاف الفم، زيادة التسوس، وتغير في شكل نمو الوجه والفكين.",
        "التيجان المصنوعة من الزيركونيا متوفرة الآن للأطفال لترميم الأسنان اللبنية المدمرة بشكل جمالي طبيعي.",
        "يجب تنظيف لثة الرضيع بقطعة شاش مبللة حتى قبل بزوغ الأسنان لإزالة البكتيريا وتعويده على روتين النظافة.",
        "إهمال علاج الأسنان اللبنية المتعفنة يؤثر سلباً على نمو السن الدائم تحته وقد يخرجه بتشوهات في لون المينا.",
        "الفحص الدوري كل 6 أشهر للأطفال يكتشف التسوس المبكر.",
        "تقويم الأسنان الوقائي للأطفال يبدأ من عمر 7 سنوات.",
        "المواد السادة للشقوق تقلل تسوس الأضراس بنسبة 80%.",
        "الرضاعة الطبيعية تقلل من تسوس الأسنان مقارنة بالزجاجة.",
        "يجب تجنب إعطاء الطفل عصائر محلاة في زجاجة أثناء النوم.",
        "تعليم الطفل استخدام الخيط من عمر 4 سنوات.",
        "أسنان الطفل اللبنية مهمة للنطق الصحيح.",
        "مشروبات الطاقة تضر بأسنان الأطفال بشدة.",
        "فرشاة الأسنان الناعمة هي الأفضل للأطفال.",
        "الفلورايد الجهازي (قطرات) يوصى به في المناطق الخالية من الفلورايد.",
        "خلع الأسنان اللبنية المتأخرة قد يتطلب تدخلاً جراحياً بسيطاً.",
        "الابتسامة الجميلة تزيد ثقة الطفل بنفسه.",
        "صدمات الأسنان عند الأطفال شائعة في مرحلة تعلم المشي.",
        "يمكن استخدام واقي الفم للأطفال أثناء الرياضة.",
        "توعية الأطفال عن طريق القصص والألعاب تشجعهم على تنظيف الأسنان.",
        "بعض الأدوية (كالشراب المحلى) تزيد تسوس الأسنان.",
        "مرضى الربو الذين يستخدمون البخاخات الفموية عرضة لجفاف الفم وتسوس الأسنان.",
        "أسنان الطفل اللبنية تبدأ بالظهور من 6 أشهر.",
        "عدد الأسنان اللبنية 20 سناً، والدائمة 32 سناً.",
        "أول سن دائم يظهر هو الضرس الأول السفلي في عمر 6 سنوات."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<span class="num">${i+1}</span> ${f}`; container.appendChild(d); });
</script>
</body>
</html>
