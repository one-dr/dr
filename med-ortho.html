<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقويم الأسنان الحديث والشفاف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#eaf4f4;font-family:'Tajawal';padding:20px;color:#2d4a4a;}
        .container{max-width:1100px;margin:auto;}
        h1{text-align:center;color:#2c6e6e;font-size:1.9rem;}
        .sub{text-align:center;color:#468b8b;margin-bottom:30px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
        .card{background:white;border-radius:28px;padding:18px;box-shadow:0 6px 12px rgba(0,0,0,0.05);border-right:4px solid #2c6e6e;}
        .num{color:#2c6e6e;font-weight:800;margin-left:8px;}
        footer{text-align:center;margin-top:35px;color:#5f9e9e;}
    </style>
</head>
<body>
<div class="container">
    <h1>📐 تقويم الأسنان الحديث والشفاف</h1>
    <div class="sub">40 حقيقة عن تقويم الأسنان وتقنياته المتطورة</div>
    <div class="grid" id="factsGrid"></div>
    <footer>ابتسامة مستقيمة = ثقة لا حدود لها</footer>
</div>
<script>
    const facts = [
        "التقويم الشفاف يستخدم سلسلة من القوالب البلاستيكية غير المرئية لتحريك الأسنان بدقة ميكرومترية.",
        "يمكن لتقنية الـ 3D التنبؤ بحركة السن وتصميم جميع قوالب التقويم الشفاف من الجلسة الأولى.",
        "الزراعات التقويمية الصغيرة تُثبت في العظم مؤقتاً لسحب الأسنان المعقدة دون التأثير على الأسنان المجاورة.",
        "التقويم ليس تجميلياً فقط، بل يعالج آلام مفصل الفك، الشخير، ومشاكل الإطباق والهضم الناتجة عن سوء المضغ.",
        "الحاصرات التقويمية ذاتية الإغلاق تلغي الحاجة للأربطة المطاطية وتسرع حركة الأسنان مع ألم أقل.",
        "تقنية تسريع التقويم تستخدم اهتزازات ميكروسكوبية لتسريع حركة العظم واختصار مدة العلاج بنسبة 40%.",
        "العمر ليس عائقاً لتقويم الأسنان؛ طالما العظم واللثة بصحة جيدة، يمكن إجراء التقويم في سن الستين.",
        "التقويم اللساني (الداخلي) يُثبت خلف الأسنان ليصبح مخفياً تماماً عن الأنظار أثناء الكلام والضحك.",
        "الأسنان تمتلك ذاكرة مكانية، لذلك استخدام المثبت بعد التقويم ضروري جداً لمنعها من العودة لمكانها القديم.",
        "الأسنان المنطمرة في سقف الحلق (كالأنياب) يمكن سحبها تدريجياً وإعادتها لمكانها الطبيعي في القوس السني.",
        "التقويم الحديث يوسع الفك الضيق لتحسين مجرى الهواء والتنفس الأنفي لدى الأطفال.",
        "سوء إطباق الأسنان قد يؤدي إلى الصداع النصفي وآلام الرقبة بسبب الإجهاد المستمر لعضلات المضغ.",
        "الذكاء الاصطناعي في التقويم الشفاف يراقب التزام المريض بلبس القوالب عبر مستشعرات لونية دقيقة.",
        "الأسلاك التقويمية الحديثة مصنوعة من سبائك التيتانيوم والنيكل التي تتأثر بحرارة الفم لتوليد قوة سحب مستمرة ولطيفة.",
        "الأشعة السيفالومترية تُستخدم في التقويم لدراسة زوايا العظام وجماليات البروفايل الجانبي للوجه.",
        "تقويم أسنان الأطفال الوقائي (في سن 7-9 سنوات) يوفر على الأهل علاجات جراحية معقدة مستقبلاً.",
        "الحاصرات الخزفية (الشفافة) لا تتصبغ، لكن الأربطة المطاطية حولها هي التي قد يتغير لونها مع الطعام.",
        "خلع بعض الأسنان في التقويم يكون ضرورياً لحل مشاكل التزاحم الشديد ولحماية الشفاه من البروز المفرط.",
        "يمكن دمج الجراحة التقويمية مع التقويم لتصحيح تشوهات الفك العظمية الكبيرة.",
        "حركة الأسنان السريعة جداً والقوية قد تؤدي لامتصاص جذور الأسنان، لذلك القوة اللطيفة والمستمرة هي الأفضل علمياً.",
        "متوسط مدة التقويم من 12 إلى 24 شهراً حسب الحالة.",
        "التقويم الشفاف مناسب لـ 70% من حالات سوء الإطباق.",
        "يجب ارتداء القوالب الشفافة 22 ساعة يومياً.",
        "يمكن إزالة التقويم الشفاف للأكل والتنظيف.",
        "الحاصرات المعدنية التقليدية أقوى في الحالات المعقدة.",
        "الأسلاك ذات الذاكرة الشكلية تنتج قوة مستمرة ومناسبة.",
        "تقويم الأطفال المبكر يمنع الحاجة لخلع الأسنان الدائمة.",
        "مرضى التقويم يجب أن يتجنبوا الأطعمة الصمغية والصلبة.",
        "تقويم الأسنان يحسن من نظافة الفم بتقليل ازدحام الأسنان.",
        "يمكن استخدام المثبت الشفاف الثابت أو المتحرك بعد التقويم.",
        "تقنية التصوير ثلاثي الأبعاد تساعد في تخطيط التقويم بدقة.",
        "الحاصرات المصنوعة من الياقوت شبه شفافة وجميلة.",
        "تقويم الأسنان لا يؤثر على الرضاعة الطبيعية للأمهات.",
        "آلام التقويم تكون في الأيام الأولى فقط وتهدأ لاحقاً.",
        "يمكن ممارسة الرياضة أثناء التقويم باستخدام واقي الفم.",
        "تقويم الأسنان يساعد في علاج توقف التنفس أثناء النوم.",
        "التقويم اللساني غير مرئي ولكنه قد يؤثر على النطق مؤقتاً.",
        "تقنية (Acceledent) تسرع الحركة بنسبة 50%.",
        "الواقي الليلي يحمي الأسنان من الصرير أثناء التقويم.",
        "النتيجة النهائية للتقويم تظهر بعد 6 أشهر من استخدام المثبت."
    ];
    const container = document.getElementById('factsGrid');
    facts.forEach((f,i)=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<span class="num">${i+1}.</span> ${f}`; container.appendChild(d); });
</script>
</body>
</html>
